---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts/finalizers
  verbs:
  - update
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts/status
  verbs:
  - get
  - patch
  - update
