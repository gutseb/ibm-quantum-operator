# This rule is not used by the project ibm-quantum-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to quantum.example.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ibm-quantum-operator
    app.kubernetes.io/managed-by: kustomize
  name: ibmquantumaccount-viewer-role
rules:
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts/status
  verbs:
  - get
