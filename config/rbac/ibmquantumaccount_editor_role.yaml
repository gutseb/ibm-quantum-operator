# This rule is not used by the project ibm-quantum-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the quantum.example.com.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: ibm-quantum-operator
    app.kubernetes.io/managed-by: kustomize
  name: ibmquantumaccount-editor-role
rules:
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - quantum.example.com
  resources:
  - ibmquantumaccounts/status
  verbs:
  - get
